
name: Build ULTRON APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract ULTRON source ZIP
        run: |
          unzip -q ULTRON-0.4.1-Full-Source.zip
          test -f ultron_final_work/app/build.gradle.kts

      - name: Run unit tests
        working-directory: ultron_final_work
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build ULTRON debug APK
        working-directory: ultron_final_work
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-APK
          path: ultron_final_work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
